<html>
<head>
<link rel="stylesheet" href="/house.css">
<link rel="stylesheet" href="/rail/tracklayout.css">
<script>

var LatestConfig = 0;

function railRefresh (response) {

    document.getElementsByTagName('title')[0].innerHTML =
        response.host+' - '+response.rail.layout+' Tracks';

    const iframe = document.getElementsByTagName('iframe');
    for (var i = 0; i < iframe.length; ++i) {
       iframe[i].contentWindow.location.reload(true);
    }
    LatestConfig = response.latest;
}

function railStatus () {
    var url = "/rail/identify";
    if (LatestConfig) url += '?known=' + LatestConfig;

    var command = new XMLHttpRequest();
    command.open("GET", url);
    command.onreadystatechange = function () {
        if (command.readyState === 4 && command.status === 200) {
            railRefresh (JSON.parse(command.responseText));
        }
    }
    command.send(null);
}

window.onload = function() {
   railStatus();
   setInterval (railStatus, 5000);
};
</script>
<title>Tracks</title>
</head>
<body>
   <nav>
      <table>
      <tr>
      <td><a href="/rail/index.html">Trains</a></td>
      <td><span>Tracks</span></td>
      <td><a href="/rail/field.html">Field</a></td>
      <td><a href="/rail/events.html">Events</a></td>
      </tr>
      </table>
   </nav>
   <main>
   <article>
   <div width="100%">
      <iframe id="mapcontent" class="houserailcontent" src="/rail/track/display"></iframe>
   </div>
   </article>
   </main>
</body>
</html>
